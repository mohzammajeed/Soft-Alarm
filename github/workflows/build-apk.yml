name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:        # lets you press "Run workflow" by hand in the Actions tab

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1. Debug APK (for testing). Runs on every push.
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files are present
        run: |
          missing=0
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file: $f. Upload the whole project to the repo root, not only some files."
              missing=1
            fi
          done
          if [ -d app/src/main/java/com/example ]; then
            echo "::error::Old folder app/src/main/java/com/example still exists. Delete it (the app now uses com/softalarm/app)."
            missing=1
          fi
          exit $missing

      - name: Firebase file check (optional)
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          path = "app/google-services.json"
          if not os.path.isfile(path):
              print("::notice::app/google-services.json not found. Building WITHOUT Firebase. Add the file to turn it on.")
              sys.exit(0)
          try:
              data = json.load(open(path, encoding="utf-8"))
          except Exception as e:
              print("::error::app/google-services.json is not valid JSON: " + str(e))
              sys.exit(1)
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in data.get("client", [])]
          if "com.softalarm.app" not in packages:
              print("::error::google-services.json has package(s) " + str(packages) + " but the app is com.softalarm.app. In Firebase add an Android app with exactly com.softalarm.app and download the file again.")
              sys.exit(1)
          print("::notice::Firebase file found for com.softalarm.app. Firebase will be enabled.")
          PYEOF

      - name: Voice files report (never fails the build)
        run: |
          total=0; found=0; missing_list=""
          for key in $(grep -o 'Voice("[a-z_]*"' app/src/main/java/com/softalarm/app/Voices.kt | sed 's/Voice("//; s/"//'); do
            if [ "$key" = "default" ] || [ "$key" = "custom" ]; then continue; fi
            total=$((total+1))
            if [ -f "app/src/main/assets/audio/$key.mp3" ]; then found=$((found+1)); else missing_list="$missing_list $key"; fi
          done
          echo "::notice::Voice mp3 files found: $found of $total. Missing ones play the phone's alarm tone."
          if [ "$found" -lt "$total" ]; then echo "Missing:$missing_list" | fold -w 150; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SoftAlarm-debug.apk
          ls -l dist

      - name: Upload APK (download it from the run page, under Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SoftAlarm-debug-apk
          path: dist/SoftAlarm-debug.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # 2. Payment server tests (no keys needed)
  # ------------------------------------------------------------------
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Payment server tests
        working-directory: backend-stub
        run: npm test

  # ------------------------------------------------------------------
  # 3. App unit tests (payment flow, restore flow, refund sync, delete account ...)
  # ------------------------------------------------------------------
  kotlin-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: App unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 4. SIGNED release files. Runs ONLY when you push a version tag such as v1.0.0
  #    (needs the 4 signing secrets: see STORE_READINESS.md)
  # ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, server-tests, kotlin-unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag looks like v1.2.3
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Tag '$TAG' is not like v1.0 or v1.2.3. Delete it and create a correct one."
            exit 1
          fi
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check the signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          fail=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is missing. Add it in GitHub: Settings > Secrets and variables > Actions. See STORE_READINESS.md."
              fail=1
            fi
          done
          exit $fail

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened with that password and alias. Check KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the signed release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace -PappVersionName="$VERSION_NAME" -PappVersionCode="${{ github.run_number }}"

      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect the files and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SoftAlarm-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/SoftAlarm-${VERSION_NAME}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: SoftAlarm-release-files
          path: dist/
          if-no-files-found: error

      - name: Publish a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "SoftAlarm $TAG" --generate-notes
